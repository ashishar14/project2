
apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: analytics

  template:
    metadata:
      labels:
        app: analytics

    spec:
      containers:
      - name: website

        image: ashishar14/analytics-website:v1

        ports:
        - containerPort: 80
